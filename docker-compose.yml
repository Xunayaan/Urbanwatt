# Lance l'API et l'interface web. La base PostgreSQL tourne dans SON PROPRE conteneur
# (autre docker-compose / autre commande) : elle doit être connectée au réseau externe
# défini en bas de ce fichier (voir le guide, étape « Réseau Docker »).
#
#   navigateur ──► web (nginx :80) ──/api/──► api (FastAPI :8000) ──► conteneur PostgreSQL
#                  http://localhost:8080
services:
  api:
    build: .
    container_name: api_urbanwatt
    env_file: .env
    ports:
      - "8000:8000"          # accès direct à l'API et au Swagger : http://localhost:8000/docs
    networks:
      - bornes_net
    restart: unless-stopped
    healthcheck:             # teste uniquement que le processus répond (pas la base)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    container_name: web_urbanwatt
    ports:
      - "8080:80"            # interface web : http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bornes_net
    restart: unless-stopped

networks:
  bornes_net:
    external: true           # réseau créé AVANT, partagé avec le conteneur de la base
    name: ${DB_NETWORK:-bornes_net}
