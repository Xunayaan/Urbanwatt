server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker : permet de retrouver le conteneur "api" par son nom,
    # y compris s'il (re)démarre après nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tout ce qui commence par /api/ est transmis à l'API FastAPI (réseau Docker interne).
    #   navigateur : GET /api/clients  ->  nginx  ->  GET http://api:8000/clients
    # Avantage : le navigateur ne parle qu'à UNE origine (localhost:8080) => aucun problème de CORS.
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;          # retire le préfixe /api
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Fichiers statiques de l'interface.
    # Un fichier absent renvoie un vrai 404 (et non index.html, qui masquerait l'erreur :
    # le navigateur recevrait du HTML à la place d'un module JavaScript).
    location / {
        try_files $uri $uri/ =404;
    }

    # Pas de cache pour index.html et config.js : une modification est visible immédiatement
    location ~* (index\.html|config\.js)$ {
        add_header Cache-Control "no-store";
    }
}